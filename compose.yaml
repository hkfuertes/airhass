services:
  airhass:
    # Prebuilt by GitHub Actions; replace with `build: .` to compile locally.
    image: ghcr.io/hkfuertes/airhass:latest
    network_mode: host
    restart: unless-stopped
    environment:
      HA_URL: http://homeassistant.local:8123
      HA_TOKEN: ${HA_TOKEN:?HA_TOKEN is required}
