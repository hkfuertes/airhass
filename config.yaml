name: AirHass
version: "1.13.1"
slug: airhass
description: Expose Home Assistant media players as AirPlay targets.
arch:
  - aarch64
  - amd64
init: false
host_network: true
homeassistant_api: true
options:
  exclude_platforms: []
schema:
  exclude_platforms:
    - list(cast|sonos|dlna_dmr|kodi|mpd|plex|yamaha_musiccast)
